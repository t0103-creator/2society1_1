<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe7">
  <title>MY MINI ROOM</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/room.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app" class="miniroom-app">
    <header class="topbar">
      <div class="brand">
        <strong>MY MINI ROOM</strong>
        <span>가구와 미니미를 자유롭게 배치해 보세요.</span>
      </div>
      <div class="top-actions">
        <span id="saveStatus" class="save-status">✓ 자동 저장됨</span>
        <button id="undoBtn" class="tool-btn" title="실행 취소">↶</button>
        <button id="redoBtn" class="tool-btn" title="다시 실행">↷</button>
        <button id="resetBtn" class="tool-btn danger-soft" title="미니룸 초기화">초기화</button>
      </div>
    </header>

    <main class="workspace">
      <aside id="assetPanel" class="asset-panel">
        <div class="panel-head">
          <strong id="assetPanelTitle">가구</strong>
          <button id="closeAssetPanelBtn" class="panel-close" aria-label="아이템 패널 닫기">×</button>
        </div>
        <div id="assetGrid" class="asset-grid"></div>
      </aside>

      <section class="stage-shell">
        <div id="stageViewport" class="stage-viewport">
          <div id="stage" class="stage" tabindex="0" aria-label="미니룸 편집 공간"></div>
        </div>
      </section>

      <aside id="objectPanel" class="object-panel hidden" aria-live="polite">
        <div class="object-panel-head">
          <strong id="selectedName">선택 아이템</strong>
          <button id="closeObjectPanelBtn" class="panel-close" aria-label="설정 닫기">×</button>
        </div>

        <div class="position-row">
          <label>X <input id="posX" type="number" min="0" max="1280" step="1"></label>
          <label>Y <input id="posY" type="number" min="0" max="720" step="1"></label>
          <button id="applyPositionBtn" class="action-btn">위치 적용</button>
        </div>

        <div id="textEditor" class="text-editor hidden">
          <textarea id="objectText" rows="3" maxlength="300" placeholder="말풍선 내용을 입력하세요."></textarea>
          <button id="applyTextBtn" class="action-btn wide">말풍선 내용 적용</button>
        </div>

        <div class="object-actions">
          <button id="scaleDownBtn" class="action-btn">－ 축소</button>
          <button id="scaleUpBtn" class="action-btn">＋ 확대</button>
          <button id="flipBtn" class="action-btn">↔ 반전</button>
          <button id="frontBtn" class="action-btn">↑ 앞으로</button>
          <button id="backBtn" class="action-btn">↓ 뒤로</button>
          <button id="deleteBtn" class="action-btn danger">삭제</button>
        </div>
      </aside>
    </main>

    <nav id="categoryBar" class="category-bar" aria-label="미니룸 아이템 카테고리">
      <button class="category-btn active" data-category="furniture">🪑<span>가구</span></button>
      <button class="category-btn" data-category="characters">🙂<span>미니미</span></button>
      <button class="category-btn" data-category="speech">💬<span>말풍선</span></button>
      <button class="category-btn" data-category="decorations">✨<span>꾸미기</span></button>
      <button class="category-btn" data-category="backgrounds">🖼️<span>배경</span></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/room.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
